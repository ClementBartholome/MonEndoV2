version: '3.8'
name: monendovue

# Environnement de développement local uniquement : la production utilise
# docker-compose.prod.yml sur le VPS. Définir le mot de passe SA dans un fichier .env
# local (non versionné) : MSSQL_SA_PASSWORD=...

services:
  # Base de données SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: monendo_database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Définir MSSQL_SA_PASSWORD dans .env}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - monendo_network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Application MonEndoVue
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: monendovue-app:latest
    container_name: monendo_app
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=true;ConnectRetryCount=3;ConnectRetryInterval=10;
    volumes:
      # Persister les logs
      - ./logs:/app/Logs
      # Persister les clés de chiffrement
      - ./keys:/app/keys
      # Configuration locale (exclue de l'image par .dockerignore)
      - ./MonEndoVue.Server/appsettings.Development.json:/app/appsettings.Development.json:ro
    networks:
      - monendo_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Pas de healthcheck conteneur : l'image aspnet n'embarque ni curl ni wget.
    # Vérifier http://localhost:8080/health

volumes:
  sqlserver_data:
    driver: local

networks:
  monendo_network:
    driver: bridge
