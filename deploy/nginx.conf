events {
    worker_connections 1024;
}

http {
    # Pas de numéro de version de nginx dans l'en-tête Server ni dans les pages d'erreur.
    server_tokens off;

    upstream app {
        server app:80;
    }

    # Redirection HTTP vers HTTPS, sur le nom demandé (monendoapp.fr ou www) : jamais vers l'adresse IP,
    # que le certificat ne couvre pas. Seule exception : les défis de renouvellement du certificat (certbot en webroot).
    server {
        listen 80;
        server_name monendoapp.fr www.monendoapp.fr;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name monendoapp.fr www.monendoapp.fr;
        client_max_body_size 10M;

        # Certificat Let's Encrypt (monendoapp.fr et www.monendoapp.fr), copié dans ~/app/ssl par le hook de
        # renouvellement (deploy/certbot-deploy-hook.sh), qui recharge ensuite nginx.
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        # Suites TLS 1.2 « intermediate » de Mozilla. Le certificat est en ECDSA : sans les suites ECDHE-ECDSA,
        # aucune négociation TLS 1.2 n'aboutit (seul TLS 1.3, qui ignore cette liste, fonctionnait).
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # Seul en-tête de sécurité posé par nginx : l'application (HTTP derrière le proxy) ne peut pas l'émettre.
        # Les autres (X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy, CSP) sont posés
        # par l'application (Services/EntetesSecurite.cs) : les répéter ici les envoie en double, ce que les
        # navigateurs et les scanners traitent comme invalide.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
