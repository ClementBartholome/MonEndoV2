name: CI/CD VPS Docker

# Pipeline en 3 étapes :
#   1. verifier  (PR, main, release/**, tags v*) : dépendances, type-check + build du client, lint, build .NET, SonarCloud
#   2. image     (idem) : build de l'image Docker ; poussée sur GHCR uniquement pour main et les tags de version v*
#   3. deployer  (main)  : déploiement sur le VPS puis vérification de /health
#   e2e (PR vers main seulement, en parallèle) : parcours de l'interface avec une API simulée (Playwright, Chromium)
# Tout push sur main déploie en production. Un tag vX.Y.Z publie l'image :vX.Y.Z (rollback) sans déployer.

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Vide sur les PR venant d'un fork : les étapes SonarCloud sont alors ignorées.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet requis par SonarCloud

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monendovue.client/package-lock.json

      # .NET avant le build client : vite.config.ts exporte les certificats via dotnet dev-certs.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install client dependencies
        run: npm ci
        working-directory: ./monendovue.client

      - name: Type-check and build client
        run: npm run build
        working-directory: ./monendovue.client

      - name: Run ESLint
        run: npx eslint . --ext .vue,.ts,.js --ignore-path ../.gitignore
        working-directory: ./monendovue.client
        continue-on-error: true

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache SonarQube Cloud packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        if: env.SONAR_TOKEN != ''
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: env.SONAR_TOKEN != '' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      # Analyse SonarCloud non bloquante : un token expiré ou une panne Sonar ne doit pas empêcher le déploiement.
      - name: SonarQube - Begin Analysis
        id: sonar-begin
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        # Couverture : rapport OpenCover produit par `dotnet test` (coverlet). Exclus de la couverture : les migrations EF
        # (code généré) et le client, qui n'a pas encore de tests unitaires (à revoir avec l'arrivée de Vitest).
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin /k:"ClementBartholome_MonEndoV2" /o:"clementbartholome" /d:sonar.token="${{ env.SONAR_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**,monendovue.client/**"

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET project
        run: dotnet build --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage;Format=opencover"

      - name: SonarQube - End Analysis
        if: env.SONAR_TOKEN != '' && steps.sonar-begin.outcome == 'success'
        continue-on-error: true
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

  # Parcours de l'interface (Playwright, API simulée, Chromium mobile 375px et desktop) : voir docs/tests.md.
  # Seulement sur les PR vers main (livraison d'une version ou hotfix), en parallèle de verifier : n'allonge pas les
  # autres PR ni le déploiement. Un échec est visible sur la PR avant le merge.
  e2e:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: monendovue.client/package-lock.json

      # Le serveur Vite des tests est en HTTPS : vite.config.ts exporte le certificat avec dotnet dev-certs.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install client dependencies
        run: npm ci
        working-directory: ./monendovue.client

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: ./monendovue.client

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: ./monendovue.client

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            monendovue.client/playwright-report/
            monendovue.client/test-results/
          retention-days: 7

  image:
    needs: verifier
    runs-on: ubuntu-latest
    env:
      # Seuls main et les tags de version publient une image ; les PR et les branches release/** la construisent seulement.
      PUBLIER: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags historiques conservés (le compose du VPS peut référencer latest, main ou main-<sha>)
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}

      # Sur PR et release/** : l'image est construite (validation du Dockerfile) mais jamais poussée.
      - name: Build (and push on main / version tags) Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ env.PUBLIER == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL_PROD=https://monendoapp.fr/

  deployer:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # le VPS tire l'image GHCR avec le GITHUB_TOKEN de ce job
    environment:
      name: production
      url: https://monendoapp.fr
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            cd ~/app

            # .env ne sert qu'à l'interpolation du compose (DB_PASSWORD) ; l'environnement est fixé dans le compose
            cat > .env << EOF
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            # Connexion au registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull de la nouvelle image de l'app seulement
            docker compose -f docker-compose.prod.yml pull app

            # Redémarrage des services (app sera recréée, db gardée)
            docker compose -f docker-compose.prod.yml up -d

            docker compose -f docker-compose.prod.yml ps

            # Nettoyage des anciennes images
            docker image prune -f

      # L'ancienne version renvoie index.html sur /health (fallback SPA) : seul "Healthy"
      # prouve que la nouvelle version a démarré (migrations EF comprises).
      - name: Check production health
        run: |
          for i in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 10 https://monendoapp.fr/health || true)" = "Healthy" ]; then
              echo "Production healthy (tentative $i)."
              exit 0
            fi
            echo "En attente de /health (tentative $i/30)..."
            sleep 10
          done
          echo "::error::https://monendoapp.fr/health ne répond pas Healthy après 5 minutes."
          exit 1
